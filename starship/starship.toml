"$schema" = 'https://starship.rs/config-schema.json'

# Colors are ANSI names (blue, purple, …) rather than hex, so the prompt follows
# Ghostty's theme — Rose Pine in dark mode, Rose Pine Dawn in light mode — automatically.
#
#   ~/pds/repos/rx_analytics   main !2 ?1            🐍 3.12 (.venv)  took 4s  2:41pm
#   ❯

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$cmd_duration\
$time
$character"""

add_newline = true
command_timeout = 1000

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_state]
style = "bold yellow"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "yellow"
conflicted = "=$count "
untracked = "?$count "
stashed = "≡ "
modified = "!$count "
staged = "[+$count ](green)"
renamed = "»$count "
deleted = "[✘$count ](red)"
ahead = "[⇡$count](cyan)"
behind = "[⇣$count](cyan)"
diverged = "[⇡$ahead_count⇣$behind_count](red)"

[fill]
symbol = " "

[python]
symbol = "🐍 "
format = '[$symbol$version( \($virtualenv\))]($style) '
style = "green"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%-I:%M%P"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
